<style>
:root{
  --ac:#059669; --ac-cl:#10b981; --ac2:#7c3aed; --warn:#d97706; --red:#ef4444;
  --ink:#1a1a2e; --bg:#f8f9fa; --sup:#ffffff; --sup2:#f1f3f5;
  --bord:#e0e0e8; --mut:#6b7280;
  --s:'Syne',system-ui,sans-serif; --m:'IBM Plex Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e6e8ea;font-family:var(--s);padding:26px 18px 80px}
.barra{position:sticky;top:0;z-index:60;background:#fff;border:1px solid var(--bord);border-radius:14px;
  padding:17px 22px;margin:0 auto 26px;max-width:1150px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
.barra h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.barra p{font-size:13.5px;color:var(--mut);line-height:1.55}
.barra code{font-family:var(--m);font-size:12.5px;background:var(--sup2);padding:1px 6px;border-radius:4px}
.mes{max-width:1150px;margin:0 auto 12px;padding:20px 4px 8px;font-size:15px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--ink)}
.lista{max-width:1150px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.bloque{background:#fff;border:1px solid var(--bord);border-radius:16px;overflow:hidden}
.meta{padding:12px 19px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:11px;
  flex-wrap:wrap;background:var(--sup2)}
.meta .num{font-family:var(--m);font-size:12px;font-weight:600;color:var(--ac)}
.meta .tit{font-weight:700;font-size:14px;flex:1;min-width:170px}
.meta .pil{font-family:var(--m);font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600}
.esc{padding:20px;display:flex;justify-content:center;background:#eef0f2}

/* ══ PLACA 1080×1080 ══════════════════════════════════════════════════════ */
.p{width:1080px;height:1080px;flex-shrink:0;position:relative;overflow:hidden;
  transform:scale(.44);transform-origin:top center;margin-bottom:-605px;
  background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding:76px 76px 68px}

/* Trama de fondo: referencia al papel de obra. Sutil, es identidad no ruido. */
.p::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--bord) 1px,transparent 1px),
                   linear-gradient(90deg,var(--bord) 1px,transparent 1px);
  background-size:54px 54px}
.p.osc{background:var(--ink);color:var(--bg)}
.p.osc::before{background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);opacity:1}
.p.ver{background:var(--ac);color:#fff}
.p.ver::before{background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);opacity:1}
.p.vio{background:var(--ac2);color:#fff}
.p.vio::before{background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);opacity:1}
.p>*{position:relative;z-index:1}

/* Barra de marca superior */
.cab{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;
  border-bottom:5px solid var(--ink)}
.osc .cab{border-color:var(--ac-cl)} .ver .cab,.vio .cab{border-color:rgba(255,255,255,.6)}
.logo{font-size:31px;font-weight:800;letter-spacing:-.02em;color:var(--ac)}
.osc .logo{color:var(--ac-cl)} .ver .logo,.vio .logo{color:#fff}
.logo span{color:var(--ink);font-weight:700}
.osc .logo span{color:var(--bg)} .ver .logo span,.vio .logo span{color:rgba(255,255,255,.75)}
.cab .et{font-family:var(--m);font-size:19px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--mut)}
.osc .cab .et{color:#8b93a5} .ver .cab .et,.vio .cab .et{color:rgba(255,255,255,.8)}

.tit{font-size:82px;font-weight:800;line-height:1.02;letter-spacing:-.035em;margin-top:44px;text-wrap:balance}
.tit.ch{font-size:62px} .tit.mch{font-size:52px}
.tit em{font-style:normal;color:var(--ac)}
.osc .tit em{color:var(--ac-cl)} .ver .tit em,.vio .tit em{color:rgba(255,255,255,.7)}
.baj{font-size:31px;color:var(--mut);line-height:1.45;margin-top:24px;max-width:25ch}
.osc .baj{color:#98a0b2} .ver .baj,.vio .baj{color:rgba(255,255,255,.9)}

.cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center;margin:30px 0 22px}

/* Lista de datos */
.fila{display:flex;align-items:baseline;gap:20px;padding:17px 0;border-bottom:2px solid var(--bord)}
.osc .fila{border-color:#31344a} .ver .fila,.vio .fila{border-color:rgba(255,255,255,.28)}
.fila:last-child{border-bottom:none}
.fila .q{flex:1;font-size:31px;font-weight:600;line-height:1.22}
.fila .c{font-family:var(--m);font-size:40px;font-weight:600;color:var(--ac);white-space:nowrap}
.osc .fila .c{color:var(--ac-cl)} .ver .fila .c,.vio .fila .c{color:#fff}
.fila .u{font-family:var(--m);font-size:21px;color:var(--mut)}
.osc .fila .u{color:#8b93a5} .ver .fila .u,.vio .fila .u{color:rgba(255,255,255,.75)}

/* Lista numerada */
.pasos{display:flex;flex-direction:column;gap:22px}
.paso{display:flex;gap:22px;align-items:flex-start}
.paso .n{font-family:var(--m);font-size:29px;font-weight:600;color:var(--ac);
  border:3px solid var(--ac);border-radius:50%;width:58px;height:58px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.osc .paso .n{color:var(--ac-cl);border-color:var(--ac-cl)}
.ver .paso .n,.vio .paso .n{color:#fff;border-color:rgba(255,255,255,.75)}
.paso .t{font-size:31px;font-weight:600;line-height:1.3;padding-top:9px}

/* Número gigante */
.gr{font-family:var(--m);font-size:200px;font-weight:600;color:var(--ac);line-height:.92;letter-spacing:-.04em}
.osc .gr{color:var(--ac-cl)} .ver .gr,.vio .gr{color:#fff}
.gr-l{font-size:31px;color:var(--mut);margin-top:14px;line-height:1.38;max-width:26ch}
.osc .gr-l{color:#98a0b2} .ver .gr-l,.vio .gr-l{color:rgba(255,255,255,.9)}

/* Comparación */
.vs{display:flex;gap:22px}
.vs>div{flex:1;border-radius:18px;padding:28px}
.vs .mal{background:rgba(239,68,68,.09);border:3px solid rgba(239,68,68,.3)}
.vs .bien{background:rgba(5,150,105,.09);border:3px solid rgba(5,150,105,.35)}
.osc .vs .mal{background:rgba(239,68,68,.16)} .osc .vs .bien{background:rgba(16,185,129,.16)}
.vs h4{font-family:var(--m);font-size:19px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:18px}
.vs .mal h4{color:var(--red)} .vs .bien h4{color:var(--ac)}
.osc .vs .bien h4{color:var(--ac-cl)}
.vs p{font-size:27px;line-height:1.35;margin-bottom:13px}
.vs p:last-child{margin-bottom:0}

/* Pie */
.pie{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  padding-top:26px;border-top:5px solid var(--ink)}
.osc .pie{border-color:var(--ac-cl)} .ver .pie,.vio .pie{border-color:rgba(255,255,255,.6)}
.pie .iz{font-size:26px;font-weight:700;line-height:1.28;max-width:21ch}
.pie .de{font-family:var(--m);font-size:20px;color:var(--mut);text-align:right;line-height:1.5}
.osc .pie .de{color:#8b93a5} .ver .pie .de,.vio .pie .de{color:rgba(255,255,255,.8)}
.swipe{position:absolute;right:76px;bottom:150px;font-family:var(--m);font-size:24px;
  font-weight:600;color:var(--ac);z-index:2}
.osc .swipe{color:var(--ac-cl)} .ver .swipe,.vio .swipe{color:#fff}

@media print{
  body{background:#fff;padding:0}
  .barra,.meta,.mes{display:none}
  .esc{padding:0;background:#fff}
  .bloque{border:none;border-radius:0;break-after:page}
  .p{transform:none;margin-bottom:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:1080px 1080px;margin:0}
}
</style>

function render(p){
  const [nom,bg,fg]=PIL[p.pilar];
  let c='';
  if(p.filas) c=p.filas.map(([q,v,u])=>
    `<div class="fila"><div class="q">${q}</div><div><span class="c">${v}</span> <span class="u">${u}</span></div></div>`).join('');
  else if(p.pasos) c=`<div class="pasos">${p.pasos.map(([n,t])=>
    `<div class="paso"><div class="n">${n}</div><div class="t">${t}</div></div>`).join('')}</div>`;
  else if(p.gr) c=`<div><div class="gr">${p.gr}</div><div class="gr-l">${p.grL||''}</div></div>`;
  else if(p.vs) c=`<div class="vs"><div class="mal"><h4>${p.vs[0][0]}</h4><p>${p.vs[0][1]}</p></div>
    <div class="bien"><h4>${p.vs[1][0]}</h4><p>${p.vs[1][1]}</p></div></div>`;

  const baj=p.baj?`<div class="baj">${p.baj}</div>`:'';
  const tieneCuerpo=p.filas||p.pasos||p.gr||p.vs;
  const cls=p.titCh?'tit ch':(p.tit.length>52?'tit ch':'tit');

  return `<div class="bloque">
    <div class="meta"><span class="num">${String(p.n).padStart(2,'0')}</span>
      <span class="tit">${p.tema}</span>
      <span class="pil" style="background:${bg};color:${fg}">${nom}</span></div>
    <div class="esc"><div class="p ${p.fondo||''}">
      <div class="cab"><div class="logo">FAIM <span>OBRAS</span></div><div class="et">${p.et}</div></div>
      <div class="${cls}">${p.tit}</div>
      ${tieneCuerpo?'':baj}
      <div class="cuerpo">${c}</div>
      ${tieneCuerpo?baj:''}
      <div class="pie"><div class="iz">${p.pie[0]}</div><div class="de">${p.pie[1]}</div></div>
      ${p.swipe?'<div class="swipe">deslizá →</div>':''}
    </div></div>
  </div>`;
}

let html='';

  html+=`<div class="mes">Mes ${m} — publicaciones ${m===1?'01 a 16':'17 a 32'}</div>
         <div class="lista">${P.filter(x=>x.m===m).map(render).join('')}</div>`;
});
document.getElementById('salida').innerHTML=html;
